<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="board-column left-column">
        <div class="board-label">Player 1</div>
        <canvas id="game" width="300" height="600" aria-label="Current board"></canvas>
      </div>

      <div class="panel score-panel">
        <h1>TETRIS</h1>
        <div class="score-box">
          <div>
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>Lines</span>
            <strong id="lines">0</strong>
          </div>
          <div>
            <span>Level</span>
            <strong id="level">1</strong>
          </div>
        </div>
        <div class="mini-panel-grid">
          <div class="next-box">
            <h2>Next</h2>
            <div class="next-split">
              <div class="next-card">
                <span>P1</span>
                <canvas id="next" width="120" height="120" aria-label="Next piece preview"></canvas>
              </div>
              <div class="next-card">
                <span>P2</span>
                <canvas id="next2" width="120" height="120" aria-label="Player 2 next piece preview"></canvas>
              </div>
            </div>
          </div>

          <div class="controls">
            <h2>Controls</h2>
            <div class="controls-grid">
              <div class="player-controls">
                <h3>Player 1</h3>
                <ul>
                  <li>A / D move</li>
                  <li>W rotate</li>
                  <li>Ctrl hard drop</li>
                  <li>S soft drop</li>
                </ul>
              </div>
              <div class="player-controls">
                <h3>Player 2</h3>
                <ul>
                  <li>→ / ← move</li>
                  <li>↑ rotate</li>
                  <li>↓ soft drop</li>
                  <li>Space hard drop</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <button id="restartBtn">New Game</button>
      </div>

      <div class="board-column right-column">
        <div class="board-label">Player 2</div>
        <canvas id="mirror" width="300" height="600" aria-label="Opponent board"></canvas>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
